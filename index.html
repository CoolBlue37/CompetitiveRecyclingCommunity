<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Recycling Leaderboard</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <nav>
      <a href="index.html">Leaderboard</a>
      <a href="about.html">About</a>
    </nav>

    <h1>♻ Recycling Leaderboard</h1>
    <p class="total">Total recycled: <span id="total">0</span></p>
    <p class="message" id="message">
      Drop a recyclable in the bin, and press your grade button!
    </p>

    <div id="board">
      <div class="row" id="grade-9">
        <span class="name">9th</span>
        <div class="bar"><div class="fill"></div></div>
        <span class="count">0</span>
      </div>
      <div class="row" id="grade-10">
        <span class="name">10th</span>
        <div class="bar"><div class="fill"></div></div>
        <span class="count">0</span>
      </div>
      <div class="row" id="grade-11">
        <span class="name">11th</span>
        <div class="bar"><div class="fill"></div></div>
        <span class="count">0</span>
      </div>
      <div class="row" id="grade-12">
        <span class="name">12th</span>
        <div class="bar"><div class="fill"></div></div>
        <span class="count">0</span>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
